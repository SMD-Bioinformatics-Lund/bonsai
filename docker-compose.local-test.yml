# Deterministic synthetic fixtures for the development stack.
# Use together with docker-compose.yml and docker-compose.dev.yml.

services:
  minhash_service:
    volumes:
      - bonsai_test_minhash:/data/signature_db

  minhash_cron_service:
    volumes:
      - bonsai_test_minhash:/data/signature_db

  test-data-seeder:
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./e2e_tests/fixtures/local:/data:ro
    entrypoint: ["/bin/sh", "/data/seed.sh"]
    command: []

  test-data-groups:
    image: mongo:4.4.22
    profiles: ["init", "e2e"]
    depends_on:
      test-data-seeder:
        condition: service_completed_successfully
    volumes:
      - ./e2e_tests/fixtures/local/assign_test_groups.js:/data/assign_test_groups.js:ro
    entrypoint:
      - mongo
      - mongodb:27017/bonsai
      - /data/assign_test_groups.js
    restart: "no"
    networks: [bonsai]

volumes:
  bonsai_test_minhash:
