<!DOCTYPE html>

<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bonsai: Integrative Genomics Viewer</title>

    <!-- jQuery UI CSS -->
    <link rel="stylesheet" type="text/css"
          href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/themes/smoothness/jquery-ui.css"/>

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" type="text/css"
          href="https://maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css"/>

    <!-- jQuery JS -->
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script type="text/javascript"
            src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js"></script>

    <link rel="shortcut icon" href="//igv.org/web/img/favicon.ico">
    <!-- IGV JS-->
    <script src="https://cdn.jsdelivr.net/npm/igv@3.0.2/dist/igv.min.js"></script>
</head>

<body>
  <div id="igv-message" role="alert" hidden
       style="padding:12px; margin:5px; border:1px solid #997404; background:#fff3cd; color:#664d03;"></div>
  <div id="igv-container" class="container-fluid" style="padding:5px; border:1px solid lightgray">
    Loading IGV...
  </div>
</body>

<script type="text/javascript">
  $(document).ready(() => {
      const accessToken = "{{ access_token }}";
      const apiUrl = "{{ api_url }}";
      const sampleId = "{{ sample_id }}";
      const analysisId = {{ analysis_id | tojson }};
      const variantId = {{ variant_id | tojson }};
      const configUrl = new URL(`${apiUrl}/samples/${sampleId}/igv-config`, window.location.href);
      if (analysisId !== null && variantId !== null) {
        configUrl.searchParams.set("analysis_id", analysisId);
        configUrl.searchParams.set("variant_id", variantId);
      }
      fetch(
        configUrl, {
          method: "GET",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": `Bearer ${ accessToken }`,
          },
        })
        .then( resp  => {
          if (! resp.ok ) {
            console.error('IGV failed to fetch the config', resp)
            throw new Error("Failed to fetch IGV config")
          }
          return resp.json()
      })
      .then(async config => {
        const igvContainer = document.getElementById('igv-container');
        if (!igvContainer) {
          console.error("Cannot open IGV: container not found");
          return
        }
        igvContainer.textContent = "";
        try {
          return await igv.createBrowser(igvContainer, config);
        } catch (err) {
          if (!config.locus || !String(err.message).startsWith("Cannot set initial locus")) {
            throw err;
          }

          // A failed load still registers a browser; dispose it before retrying.
          igv.removeAllBrowsers();
          igvContainer.textContent = "";
          const message = document.getElementById('igv-message');
          message.textContent = "Could not locate this variant in the configured reference. Opening IGV without zooming. Check that the reference matches the alignment files.";
          message.hidden = false;
          const fallbackConfig = { ...config };
          delete fallbackConfig.locus;
          return await igv.createBrowser(igvContainer, fallbackConfig);
        }
      })
      .catch(err => {
        console.error("IGV load error:", err);
        igv.removeAllBrowsers();
        const message = document.getElementById('igv-message');
        message.textContent = "Could not load IGV. Check that the reference FASTA, its index, and alignment files are available and match, then try again.";
        message.hidden = false;
        const igvContainer = document.getElementById('igv-container');
        if (igvContainer) {
          igvContainer.textContent = "";
        }
      })
  });
</script>

</html>
