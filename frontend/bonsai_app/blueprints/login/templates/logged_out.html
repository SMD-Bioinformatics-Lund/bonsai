{% extends "bootstrap_base.html" %}

{% block css %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('login.static', filename='login.css') }}">
{% endblock css %}

{% block content %}
<div class="w-100">
    <div class="row vh-100">
        <div class="d-none d-xl-block col-xl-3 login-gradient-upper">
            <h1 class="text-white sw-logo-text sw-logo-text-lg fw-bold text-center pt-5">Bonsai</h1>
            <div class="login-gradient-lower overflow-hidden"></div>
            <p class="text-white fs-4 fw-bold text-center position-relative top-50 start-0">Version {{ version }}</p>
        </div>
        <div class="col-12 col-xl-9 bg-white container px-5">
            <div class="w-50 mx-auto">
                <div class="row pt-5 align-items-center">
                    <div class="col-lg-7">
                        <i class="bi bi-check-circle text-success fs-1" aria-hidden="true"></i>
                        <h1 class="mt-3">You have been logged out</h1>
                        <p class="text-muted fs-5">Your Bonsai session has ended safely.</p>
                        <a class="btn btn-dark btn-lg rounded-1 mt-3"
                           href="{{ url_for('login.login_page') }}"
                           data-test-id="login-again-btn">
                            Log in again
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
